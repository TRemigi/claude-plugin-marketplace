<script>
document.getElementById('db-static')?.remove();
const DATA = /*DATA*/null;
const D = DATA;
const $ = (t, cls, txt) => { const e = document.createElement(t); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

const https = (u) => typeof u === 'string' && /^https:\/\//.test(u);

const sysOpen = (url) => !viaServer ? Promise.resolve(false) : fetch('/open', {
  method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Daily-Brief': '1' }, body: JSON.stringify({ url }),
}).then((r) => r.ok, () => false);

  if (!https(url)) return document.createTextNode(txt);

  a.title = 'Open in your browser';
  a.addEventListener('click', (e) => {
    if (typeof openLink === 'function') { e.preventDefault(); openLink(url); return; }
    if (!viaServer) return;
    e.preventDefault();
    sysOpen(url).then((ok) => { if (!ok) window.open(url, '_blank', 'noopener'); });
  });
  return a;
};
const fmt = (m) => { if (m == null || m === '') return ''; if (m === '?') return '?'; m = Math.round(+m); if (!m) return ''; const h = Math.floor(m / 60), r = m % 60; return (h ? h + 'h' : '') + (r ? r + 'm' : ''); };

  const legacy = () => { try { const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'absolute'; ta.style.left = '-9999px'; document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok; } catch (e) { return false; } };
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).then(() => true, () => legacy());
  return Promise.resolve(legacy());
}
const send = (text, note) => {
  if (typeof sendPrompt === 'function') { sendPrompt(text); return; }
  const done = () => { note.className = 'ok'; note.textContent = 'Prompt copied — paste it into Claude to apply'; };
  const show = () => { note.className = 'ok'; note.textContent = text; note.style.userSelect = 'all'; note.style.whiteSpace = 'normal'; };
  copyText(text).then((ok) => (ok ? done() : show()));
};
const CAN_SEND = typeof sendPrompt === 'function';
// An older day's page copies a prompt too: the server writes only for today's brief.
const ADAPTER = { asana: false, todos: false, today: null, onChange: [] };
const direct = (target) => ADAPTER[target || 'asana'] && !CAN_SEND && D.today === ADAPTER.today;
const PENDING = [];

  fetch('/__adapters').then((r) => (r.ok ? r.json() : null)).catch(() => null).then((a) => {
    if (a && (a.asana === true || a.todos === true)) {

const WRITES_TO = { asana: 'Asana', todos: 'the Slack list' };
function applyLabel(btn, n, target) {

  const ps = btn.parentNode && btn.parentNode.querySelector('.paste'); if (ps) ps.style.display = n ? '' : 'none';
  btn.textContent = '';

  if (target && direct(target)) {
    btn.textContent = n ? 'Apply ' + n + (n === 1 ? ' change' : ' changes') : 'Apply changes';
    btn.title = 'Writes the changes to ' + WRITES_TO[target] + ' and reloads this page';

const PASTE_TEXT = CAN_SEND ? '' : ' The button copies a prompt; paste it into Claude to apply.';

function applyViaServer(items, btn, note, promptText, onPrompt, onApplied) {
  note.className = 'ok'; note.textContent = 'Applying…'; note.style.whiteSpace = ''; btn.disabled = true;
  fetch('/apply/asana', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Daily-Brief': '1' }, body: JSON.stringify({ day: D.today, items }) })
    .then((r) => r.json().then((body) => ({ status: r.status, body }), () => ({ status: r.status, body: {} })), () => ({ status: 0, body: {} }))

  const okDay = (d) => {  // a real calendar date (no 2026-02-31), not after today
    if (typeof d !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(d) || (D.today && d > D.today)) return false;
    const t = new Date(d + 'T00:00:00Z'); return !isNaN(t) && t.toISOString().slice(0, 10) === d;
  };
  const U = U0.map((u) => ({ ...u, entry: null, state: null,
    suggest: Number.isInteger(u.suggest) && u.suggest >= 1 && u.suggest <= 1440 ? u.suggest : 0,
    day: okDay(u.day) ? u.day : (D.today || '') }));
  const [s, h] = section('ti-clock-exclamation', 'amber', 'Untracked yesterday', U.length, 'untracked');
  const pill = h.querySelector('.pill');
  const KEY = 'daily-brief-untracked-' + (D.today || '');
  let store = {}; try { store = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };
  U.forEach((u) => { const v = store[u.gid]; if (v === 'dismissed') u.state = 'dismissed'; else if (v && v.sent) { u.state = 'sent'; u.entry = v.sent; } });
  const warn = $('span', 'warn-ic'); warn.appendChild(ic('ti-alert-triangle')); warn.setAttribute('role', 'img');
  h.insertBefore(warn, h.querySelector('h2').nextSibling);
  const UC = 6;
  const box = $('div', 'box'); const [t, tb] = table([108, null, 190, 96, 126, 56], [{ t: 'Key', title: 'Card key · copy the Asana link' }, { t: 'Task' }, { t: 'Activity' }, { t: 'Status' }, { t: 'Track', title: 'Track time on any date' }, { t: '', title: 'Dismiss' }]);
  box.appendChild(t);
  const ft = $('div', 'ft'); const hint = $('span', 'hint', 'Cards with activity yesterday but no time logged. Track or dismiss each.' + (D.untrackedBasis ? ' ' + D.untrackedBasis : '')); hint.appendChild(pasteNote());
  const err = $('span', 'err'); const apply = $('button'); ft.appendChild(hint); ft.appendChild(err);
  const acc = $('button', 'ctl'); acc.type = 'button'; ft.appendChild(acc); ft.appendChild(apply);
  const unaccepted = () => U.filter((u) => !u.state && !u.entry && u.suggest > 0);
  acc.onclick = () => {
    if (apply.disabled) return;  // an Apply in flight would be sent twice
    unaccepted().forEach((u) => { u.entry = { date: u.day, mins: u.suggest }; }); render(); apply.onclick();
  };
  if (U.length) box.appendChild(ft);
  s.appendChild(box);
  const UT = makeTracker(UC, () => render());
  const markSent = (us) => { us.forEach((u) => { u.state = 'sent'; store[u.gid] = { sent: u.entry }; }); save(); render(); };
  PENDING.push(() => U.filter((u) => u.entry && !u.state).length);
  apply.onclick = () => {
    err.className = 'err'; err.textContent = '';
    const todo = U.filter((u) => u.entry && !u.state);
    if (!todo.length) { err.textContent = 'No changes yet'; return; }
    const text = 'daily-brief: update ' + todo.map((u) => 'task ' + u.gid + ' log ' + fmt(u.entry.mins) + ' on ' + u.entry.date).join('; ');
    if (!direct()) { send(text, err); markSent(todo); return; }
    const items = todo.map((u) => ({ gid: u.gid, log: { minutes: u.entry.mins, date: u.entry.date } }));
    applyViaServer(items, apply, err, text, () => markSent(todo), (results) => markSent(todo.filter((u) => results.some((x) => x.ok && x.gid === u.gid))));
  };
  ADAPTER.onChange.push(() => render());
  function render() {
    const open = U.filter((u) => !u.state);
    const pend = U.filter((u) => u.entry && !u.state).length;
    warn.style.display = open.length ? '' : 'none';
    warn.title = open.length + (open.length === 1 ? ' card' : ' cards') + ' from yesterday still need time tracked or dismissed';
    warn.setAttribute('aria-label', warn.title);
    if (pill) pill.textContent = open.length ? open.length + ' to review' : 'all handled';
    const ua = unaccepted(); acc.style.display = ua.length ? '' : 'none';
    acc.textContent = 'Log ' + ua.length + ' suggested · ' + fmt(ua.reduce((n, u) => n + u.suggest, 0));
    acc.title = 'Log the suggested time on every card not tracked yet, together with any other pending entries';
    tb.textContent = '';
    if (!U.length) { tb.appendChild(emptyRow(UC, 'Every card with activity yesterday has time tracked')); return; }
    U.forEach((u) => {
      const tr = $('tr', (u.entry && !u.state ? 'pend' : '') + (u.state === 'dismissed' ? ' done' : ''));
      tr.appendChild(keyCell(u));
      const nm = $('td', 'nm'); nm.appendChild(link(u.name, u.url)); nm.title = u.name; tr.appendChild(nm);
      const act = $('td'); act.appendChild($('span', 'chip', u.activity || 'Activity'));
      if (u.evidence) act.appendChild($('div', 'faint', u.evidence));
      act.title = [u.activity, u.evidence].filter(Boolean).join(' — '); tr.appendChild(act);
      tr.appendChild($('td', 'mut', u.status || ''));
      if (u.state === 'sent') { const c = $('td'); const b = $('span', 'sent'); b.appendChild(ic('ti-check')); b.appendChild(document.createTextNode(' ' + fmt(u.entry.mins) + ' · sent')); b.title = 'Prompt copied for ' + u.entry.date; c.appendChild(b); tr.appendChild(c); }
      else if (u.state === 'dismissed') tr.appendChild($('td', 'faint', 'Dismissed'));
      else tr.appendChild(UT.cell(u, u.name, u.day));
      const dc = $('td'); dc.style.textAlign = 'center'; const db = $('button', 'icb');
      if (u.state === 'dismissed') { db.appendChild(ic('ti-arrow-back-up')); db.title = 'Undo dismiss'; db.onclick = () => { u.state = null; delete store[u.gid]; save(); render(); }; }
      else if (u.state === 'sent') { db.appendChild(ic('ti-arrow-back-up')); db.title = 'Mark as not tracked yet'; db.onclick = () => { u.state = null; delete store[u.gid]; save(); render(); }; }
      else { db.appendChild(ic('ti-x')); db.title = 'Dismiss — no time to track'; db.onclick = () => { u.state = 'dismissed'; u.entry = null; store[u.gid] = 'dismissed'; save(); render(); }; }
      db.setAttribute('aria-label', db.title + ': ' + u.name); dc.appendChild(db); tr.appendChild(dc);
      tb.appendChild(tr);
    });
    applyLabel(apply, pend, 'asana');
  }
  render();
})();

(function () {
  const O = D.ops;
  if (!O) return;
  // The board's columns come from the config (render-panel.py puts them in ops.sections). Without them
  // (a page saved before that existed), fall back to the statuses the rows use.
  const SEC = O.sections || [...new Set(O.rows.map((r) => r.status))].map((status) => ({ status, role: status === 'Backlog' ? 'backlog' : 'active' }));
  const withRole = (role) => SEC.filter((s) => s.role === role).map((s) => s.status);
  const ST = SEC.map((s) => s.status);
  const BACKLOG = withRole('backlog');
  const ORDER = withRole('active').concat(BACKLOG);
  const DONE = withRole('done')[0] || 'Done';
  const TONES = [null, 'blue', 'purple', 'green', 'amber'];
  const TONE = {}; ORDER.forEach((st, i) => { TONE[st] = BACKLOG.includes(st) ? null : TONES[i % TONES.length]; });
  const PR = ['P1', 'P2', 'P3'];
  const prank = (p) => { const i = PR.indexOf(p); return i < 0 ? 3 : i; };
  const rows = O.rows.map((r, i) => ({ ...r, priority: PR.includes(r.priority) ? r.priority : null, newPriority: PR.includes(r.priority) ? r.priority : null, _i: i, newStatus: r.status, entry: null, take: false, complete: false }))
    .sort((a, b) => prank(a.priority) - prank(b.priority) || String(a.created || '').localeCompare(String(b.created || '')) || a._i - b._i);
  const active = rows.filter((r) => !BACKLOG.includes(r.status)).length;
  const [s, h] = section('ti-layout-kanban', 'purple', TITLE.ops, active + ' active', 'ops');
  const mineL = $('label', 'ctl'); const mine = $('input'); mine.type = 'checkbox'; mineL.appendChild(mine); mineL.appendChild(document.createTextNode('Mine only')); h.insertBefore(mineL, h.querySelector('.sp'));
  const hasDue = rows.some((r) => r.due);
  const W = [44, 108, 70, null, 68].concat(hasDue ? [70] : [], [60, 56, 126, 118, 46]);
  const H = [{ t: '#' }, { t: 'Key', title: 'Card key · copy the Asana link' }, { t: 'Priority', title: 'P1 highest · — not prioritized' }, { t: 'Task' }, { t: 'Owner' }].concat(hasDue ? [{ t: 'Due' }] : [], [
    { t: 'Total', num: 1, title: 'Total time tracked' },
    { t: 'Yday', num: 1, title: O.ydayTitle || 'Tracked yesterday' },
    { t: 'Track', title: 'Track time on any date' }, { t: 'Status' }, { t: '✓', title: 'Mark complete', center: 1 }]);
  const cols = W.length;
  const box = $('div', 'box'); const [t, tb] = table(W, H); box.appendChild(t);
  const ft = $('div', 'ft'); const hint = $('span', 'hint', 'Track asks for a date, hours and minutes.'); hint.appendChild(pasteNote());
  const err = $('span', 'err'); const apply = $('button'); ft.appendChild(hint); ft.appendChild(err); ft.appendChild(apply); box.appendChild(ft);
  s.appendChild(box);
  (O.notes || []).forEach((n) => s.appendChild($('div', 'foot', n)));
  const groups = {}; ORDER.forEach((st) => { groups[st] = { open: false, rows: rows.filter((r) => r.status === st) }; });
  const allG = ORDER.map((st) => groups[st]);
  const sync = expander(h, allG, render);
  const pend = (r) => r.newStatus !== r.status || r.newPriority !== r.priority || r.take || r.complete || !!r.entry;
  const today = D.today || '';
  const pendCount = () => rows.filter(pend).length;
  PENDING.push(pendCount);
  const LANDED = {
    status: (r) => { r.status = r.newStatus; }, priority: (r) => { r.priority = r.newPriority; },
    take: (r) => { r.take = false; r.assignee = O.me; }, log: (r) => { r.entry = null; },
    complete: (r) => { r.complete = false; r.status = r.newStatus = DONE; },
  };
  function label() { applyLabel(apply, pendCount(), 'asana'); }
  ADAPTER.onChange.push(label);
  const T = makeTracker(cols, () => render());
  function render() {
    tb.textContent = '';
    ORDER.forEach((st) => {
      const g = groups[st]; const vis = g.rows.filter((r) => !mine.checked || r.assignee === O.me || r.take);
      const pc = g.rows.filter(pend).length;
      tb.appendChild(groupHeader(g, st, vis.length, cols, { tone: TONE[st], extra: !g.open && pc ? pc + ' pending' : null }, render));
      if (!g.open) return;
      if (!vis.length) { tb.appendChild(emptyRow(cols, 'No tasks')); return; }
      vis.forEach((r) => {
        const tr = $('tr', (pend(r) ? 'pend' : '') + (r.complete ? ' done' : ''));
        tr.appendChild($('td', 'faint num', r.n));
        tr.appendChild(keyCell(r));
        const pc = $('td'); const ps = $('select', 'prio'); ps.setAttribute('aria-label', 'Priority for row ' + r.n);
        [['', '—'], ['P1', 'P1'], ['P2', 'P2'], ['P3', 'P3']].forEach(([v, l]) => { const o = $('option', '', l); o.value = v; if (v === (r.newPriority || '')) o.selected = true; ps.appendChild(o); });
        ps.dataset.p = r.newPriority || ''; ps.onchange = () => { r.newPriority = ps.value || null; render(); }; pc.appendChild(ps); tr.appendChild(pc);
        const nm = $('td', 'nm'); nm.appendChild(link(r.name, r.url)); nm.title = r.name; tr.appendChild(nm);
        const ow = $('td');
        if (r.assignee) { ow.textContent = r.assignee.split(' ')[0]; ow.title = r.assignee; ow.className = 'mut'; }
        else { const b = $('button', 'take'); b.setAttribute('aria-label', 'Assign to me'); b.appendChild(ic(r.take ? 'ti-check' : 'ti-user-plus')); b.appendChild(document.createTextNode(r.take ? ' Me' : ' Take')); b.onclick = () => { r.take = !r.take; render(); }; ow.appendChild(b); }
        tr.appendChild(ow);
        if (hasDue) tr.appendChild($('td', r.due && today && r.due < today ? 'od' : 'mut', r.due || ''));
        const tt = $('td', 'num', fmt(r.total) || '—'); if (!fmt(r.total)) tt.classList.add('faint'); tr.appendChild(tt);
        const yd = $('td', 'num', fmt(r.yday) || '—'); if (!fmt(r.yday)) yd.classList.add('faint'); tr.appendChild(yd);
        tr.appendChild(T.cell(r, r.name, D.today));
        const sc = $('td'); const se = $('select'); se.setAttribute('aria-label', 'Status for row ' + r.n);
        ST.forEach((x) => { const o = $('option', '', x); o.value = x; if (x === r.newStatus) o.selected = true; se.appendChild(o); });
        se.disabled = r.complete; se.onchange = () => { r.newStatus = se.value; render(); }; sc.appendChild(se); tr.appendChild(sc);
        const ck = $('td'); ck.style.textAlign = 'center'; const cb = $('input'); cb.type = 'checkbox'; cb.setAttribute('aria-label', 'Mark complete'); cb.checked = r.complete;
        cb.onchange = () => { r.complete = cb.checked; render(); }; ck.appendChild(cb); tr.appendChild(ck);
        tb.appendChild(tr);
      });
    });
    label(); sync();
  }
  mine.onchange = render;
  const itemText = (n, it) => '#' + n + ' ' + it.gid + (it.status ? ' → ' + it.status : '') + (it.priority ? ' priority ' + it.priority : '')
    + (it.take ? ' +me' : '') + (it.log ? ' log ' + fmt(it.log.minutes) + ' on ' + it.log.date : '') + (it.complete ? ' complete' : '');
  apply.onclick = () => {
    err.className = 'err'; err.textContent = ''; const picked = [];
    rows.forEach((r) => {
      if (!pend(r)) return; const it = { gid: r.gid };
      if (!r.complete && r.newStatus !== r.status) it.status = r.newStatus;
      if (r.newPriority !== r.priority) it.priority = r.newPriority || 'unset';
      if (r.take) it.take = true;
      if (r.entry) it.log = { minutes: r.entry.mins, date: r.entry.date };
      if (r.complete) it.complete = true;
      picked.push({ r, it });
    });
    if (!picked.length) { err.textContent = 'No changes yet'; return; }
    const text = 'daily-brief: update ' + picked.map((p) => itemText(p.r.n, p.it)).join('; ');
    if (!direct()) { send(text, err); return; }
    applyViaServer(picked.map((p) => p.it), apply, err, text, () => {}, (results) => {
      picked.forEach((p) => { const res = results.find((x) => x.gid === p.r.gid); ((res && res.landed) || []).forEach((k) => LANDED[k] && LANDED[k](p.r)); });
      render();
    });
  };
  render();
})();

(function () {
  const T = D.todos;
  if (!T) return;
  const rows = T.rows.map((r) => ({ ...r, done: false }));
  const [s, h] = section('ti-list-check', 'amber', TITLE.todos, rows.length + ' open', 'todos');
  const box = $('div', 'box'); const [t, tb] = table([null, 96, 220, 46], [{ t: 'Task' }, { t: 'Due' }, { t: 'Notes' }, { t: '✓', title: 'Mark done', center: 1 }]);
  box.appendChild(t);
  // Add row: new todos queue as pending rows and go out with the same apply prompt as the ticks.
  const added = [];
  const af = $('form', 'addt'); af.setAttribute('aria-label', 'Add a todo');
  const at = $('input', 'at'); at.type = 'text'; at.placeholder = 'New todo'; at.setAttribute('aria-label', 'Task'); at.maxLength = 200;
  const ad = $('input'); ad.type = 'date'; ad.setAttribute('aria-label', 'Due date');
  const an = $('input', 'an'); an.type = 'text'; an.placeholder = 'Notes (optional)'; an.setAttribute('aria-label', 'Notes'); an.maxLength = 500;
  const ab = $('button'); ab.type = 'submit'; ab.appendChild(ic('ti-plus')); ab.appendChild(document.createTextNode('Add'));
  [at, ad, an, ab].forEach((x) => af.appendChild(x));
  af.onsubmit = (e) => {
    e.preventDefault();
    const task = at.value.trim(); if (!task) { at.classList.add('bad'); at.focus(); return; }
    at.classList.remove('bad');
    const r = { task, due: ad.value || '', notes: an.value.trim(), status: 'To do', isNew: true };
    added.push(r); groups[1].rows.push(r); groups[1].open = true;
    at.value = ''; ad.value = ''; an.value = ''; at.focus(); render();
  };
  box.appendChild(af);
  const ft = $('div', 'ft'); const th = $('span', 'hint', 'Ticked todos are set to Done, never deleted. Added todos are created in the list.'); th.appendChild(pasteNote()); ft.appendChild(th);
  const err = $('span', 'err'); const apply = $('button'); ft.appendChild(err); ft.appendChild(apply); applyLabel(apply, 0, 'todos'); box.appendChild(ft);
  s.appendChild(box);
  const groups = [['Doing', 'blue'], ['To do', null]].map(([st, tone]) => ({ st, tone, open: false, rows: rows.filter((r) => (r.status || 'To do') === st) }));
  const sync = expander(h, groups, render);
  const today = D.today || '';
  const todoCount = () => rows.filter((r) => r.done).length + added.length;
  PENDING.push(todoCount);
  function render() {
    tb.textContent = '';
    groups.forEach((g) => {
      tb.appendChild(groupHeader(g, g.st, g.rows.length, 4, { tone: g.tone }, render));
      if (!g.open) return;
      if (!g.rows.length) { tb.appendChild(emptyRow(4, 'No todos')); return; }
      g.rows.forEach((r) => {
        const tr = $('tr', (r.done ? 'pend done' : ''));
        const nm = $('td', 'nm', r.task); nm.title = r.task; tr.appendChild(nm);
        tr.appendChild($('td', r.due && today && r.due < today ? 'od' : 'mut', r.dueLabel || r.due || ''));
        const no = $('td', 'mut', r.notes || ''); no.title = r.notes || ''; tr.appendChild(no);
        const ck = $('td'); ck.style.textAlign = 'center';
        if (r.isNew) {
          tr.className = 'pend';
          const rm = $('button', 'rm', '×'); rm.type = 'button'; rm.title = 'Remove this new todo'; rm.setAttribute('aria-label', 'Remove new todo ' + r.task);
          rm.onclick = () => { added.splice(added.indexOf(r), 1); g.rows.splice(g.rows.indexOf(r), 1); render(); };
          ck.appendChild(rm);
        } else {
          const cb = $('input'); cb.type = 'checkbox'; cb.setAttribute('aria-label', 'Mark done'); cb.checked = r.done;
          cb.onchange = () => { r.done = cb.checked; render(); }; ck.appendChild(cb);
        }
        tr.appendChild(ck);
        tb.appendChild(tr);
      });
    });
    applyLabel(apply, todoCount(), 'todos');
    sync();
  }
  apply.onclick = () => {
    err.className = 'err'; err.textContent = '';
    const ids = rows.filter((r) => r.done).map((r) => r.id);
    if (!ids.length && !added.length) { err.textContent = 'No changes yet'; return; }
    const parts = [];
    if (ids.length) parts.push('done ' + ids.join(', '));
    if (added.length) parts.push('add ' + JSON.stringify(added.map((r) => ({ task: r.task, due: r.due, notes: r.notes }))));
    const text = 'daily-brief: todos ' + parts.join('; ');
    if (!direct('todos')) { send(text, err); return; }
    const sent = rows.filter((r) => r.done).concat(added);
    applyTodos({ day: D.today, done: ids, add: added.map((r) => ({ task: r.task, due: r.due, notes: r.notes })) }, apply, err, text, (results) => {
      sent.forEach((r, i) => {
        if (!(results[i] && results[i].ok)) return;
        groups.forEach((g) => { const k = g.rows.indexOf(r); if (k >= 0) g.rows.splice(k, 1); });
        if (r.isNew) { if (added.includes(r)) added.splice(added.indexOf(r), 1); } else { r.done = false; rows.splice(rows.indexOf(r), 1); }
      });
      render();
    });
  };
  ADAPTER.onChange.push(render);
  render();
})();
</script>
