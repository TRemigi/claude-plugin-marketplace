<!doctype html>
<html lang="en" data-panel>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily brief</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{--surface-0:#f5f4ef;--surface-1:#f0eee6;--surface-2:#ffffff;--text-primary:#1f1e1d;--text-secondary:#5e5d59;--text-muted:#8a8984;--text-accent:#2c6cb0;--text-danger:#b5382c;--text-warning:#8a5a00;--bg-warning:#faeeda;--bg-accent-muted:rgba(44,108,176,.08);--border:rgba(31,30,29,.12);--border-strong:rgba(31,30,29,.22);--border-danger:#d9534a;--radius:8px;--text-success:#3b6d11;--bg-success:#eaf3de;--bg-accent:#e6f1fb;--text-pro:#534ab7;--bg-pro:#eeedfe;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--surface-0:#1f1e1d;--surface-1:#2a2927;--surface-2:#262624;--text-primary:#f0eee6;--text-secondary:#b4b2a9;--text-muted:#85837c;--text-accent:#7fb2ea;--text-danger:#f09595;--text-warning:#f0c06a;--bg-warning:#412402;--bg-accent-muted:rgba(127,178,234,.12);--border:rgba(240,238,230,.12);--border-strong:rgba(240,238,230,.24);--border-danger:#e24b4a;--text-success:#97c459;--bg-success:#27500a;--bg-accent:#0c447c;--text-pro:#afa9ec;--bg-pro:#3c3489;color-scheme:dark}}
:root[data-theme="dark"]{--surface-0:#1f1e1d;--surface-1:#2a2927;--surface-2:#262624;--text-primary:#f0eee6;--text-secondary:#b4b2a9;--text-muted:#85837c;--text-accent:#7fb2ea;--text-danger:#f09595;--text-warning:#f0c06a;--bg-warning:#412402;--bg-accent-muted:rgba(127,178,234,.12);--border:rgba(240,238,230,.12);--border-strong:rgba(240,238,230,.24);--border-danger:#e24b4a;--text-success:#97c459;--bg-success:#27500a;--bg-accent:#0c447c;--text-pro:#afa9ec;--bg-pro:#3c3489;color-scheme:dark}
html,body{margin:0;background:var(--surface-2);color:var(--text-primary);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.page{max-width:1120px;margin:0 auto;padding:28px 32px 40px}
.theme-btn{position:absolute;top:22px;right:28px;width:32px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:17px;color:var(--text-secondary);border-radius:8px}
.theme-btn:hover{color:var(--text-primary)}
.page{position:relative}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button,select,input[type=text]{font:inherit;color:var(--text-primary);background:transparent;border:0.5px solid var(--border-strong);border-radius:var(--radius)}
button{cursor:pointer;padding:0 12px}
button:hover{background:var(--surface-1)}
input[type=text]:focus,select:focus{outline:none;box-shadow:0 0 0 2px var(--bg-accent-muted);border-color:var(--text-accent)}
select{background:var(--surface-2)}
@media (max-width:640px){.page{padding:16px}}
</style>
</head>
<body>
<div class="page">
<!--BRIEF-->
</div>
</body>
</html>
